# Credentials come from the environment: application-default credentials locally
# (`gcloud auth application-default login`), Workload Identity Federation in GitHub Actions.
antilles_hurricanes:
  target: prod
  outputs:
    prod:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT', 'antilles-hurricanes') }}"
      dataset: staging
      location: US
      threads: 4
      # Every query fails rather than bill more than 1 GB: the whole project reads a few
      # hundred MB, far inside the 1 TB a month of the free tier.
      maximum_bytes_billed: 1000000000
      job_execution_timeout_seconds: 300
      job_retries: 1
