# Credentials come from the environment: application-default credentials locally
# (`gcloud auth application-default login`), Workload Identity Federation in GitHub Actions.
# Every query fails rather than bill more than 1 GB: the whole project reads a few hundred
# MB a month, far inside the 1 TB of the free tier.
antilles_hurricanes:
  target: prod
  outputs:
    prod:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT', 'antilles-hurricanes') }}"
      dataset: staging
      location: US
      threads: 4
      maximum_bytes_billed: 1000000000
      job_execution_timeout_seconds: 300
      job_retries: 1
    # Pull requests: empty tables (`dbt build --empty`) in the `ci` dataset, whose tables
    # expire after a day, so unit tests have the parents of a new or changed model.
    ci:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT', 'antilles-hurricanes') }}"
      dataset: ci
      location: US
      threads: 4
      maximum_bytes_billed: 1000000000
      job_execution_timeout_seconds: 300
      job_retries: 1
