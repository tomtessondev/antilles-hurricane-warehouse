name: Daily

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency: daily

jobs:
  load-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT: antilles-hurricanes
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - run: hurricane-load tracks
      - run: hurricane-load weather
      - run: dbt build --profiles-dir .
      - run: hurricane-load export --out "$RUNNER_TEMP/publish/hurricanes.json"
      - uses: actions/upload-artifact@v4
        with:
          name: hurricanes
          path: ${{ runner.temp }}/publish/hurricanes.json
          if-no-files-found: error
          retention-days: 7

  # The portfolio site reads hurricanes.json from the data branch. It holds a single commit,
  # replaced on every run, so the repository does not grow by one export a day. A job of its
  # own, so the write token never shares a runner with the cloud credentials or the build.
  publish:
    needs: load-and-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hurricanes
          path: ${{ runner.temp }}/publish
      - name: Force-push the export as the data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/publish"
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hurricanes.json
          git commit -q -m "Hurricanes export from run $GITHUB_RUN_ID"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
