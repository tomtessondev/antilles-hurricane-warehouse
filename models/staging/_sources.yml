version: 2

sources:
  - name: raw
    description: Tables written by the Python loaders (`hurricane-load`).
    tables:
      - name: tracks
        description: NOAA IBTrACS North Atlantic main-track fixes since 1851, replaced each run.
      - name: island_weather
        description: Daily weather at each island's point since 1940 (Open-Meteo, ERA5 reanalysis).
