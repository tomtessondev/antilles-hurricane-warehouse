version: 2

models:
  - name: stg_tracks
    description: Track fixes, partitioned by season and clustered by storm.
    columns:
      - name: sid
        description: IBTrACS storm id.
        data_tests: [not_null]
      - name: wind_kt
        description: Maximum sustained wind (knots); null for many early fixes.
  - name: stg_island_weather
    description: Daily weather per island, partitioned by month and clustered by island.
    columns:
      - name: island
        data_tests: [not_null]
      - name: date
        data_tests: [not_null]
